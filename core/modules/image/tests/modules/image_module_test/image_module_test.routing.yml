image_module_test.image_style_protected:
  path: '/image-test-private-files/styles/{image_style}/{scheme}'
  defaults:
    _controller: '\Drupal\image\Controller\ImageStyleDownloadController::deliver'
    required_derivative_scheme: 'image-test-dummy'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

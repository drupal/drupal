# Schema for the configuration files of the text module.

text.settings:
  type: config_object
  label: 'Text settings'
  constraints:
    FullyValidatable: ~
  mapping:
    default_summary_length:
      type: integer
      label: 'Default summary length'
      constraints:
        NotNull: [ ]
        Range:
          min: 1

field.storage_settings.text:
  type: mapping
  label: 'Text (formatted) settings'
  mapping:
    max_length:
      type: integer
      label: 'Maximum length'

field.field_settings.text:
  type: mapping
  label: 'Text (formatted) settings'
  mapping:
    allowed_formats:
      type: sequence
      label: 'Allowed text formats'
      sequence:
        type: string

field.value.text:
  type: mapping
  label: 'Default value'
  mapping:
    value:
      type: label
      label: 'Value'
    format:
      type: string
      label: 'Text format'

field.storage_settings.text_long:
  label: 'Text (formatted, long) settings'
  type: field.field_settings.text

field.field_settings.text_long:
  label: 'Text (formatted, long) settings'
  type: mapping
  mapping:
    allowed_formats:
      type: sequence
      label: 'Allowed text formats'
      sequence:
        type: string

field.value.text_long:
  type: mapping
  label: 'Default value'
  mapping:
    value:
      type: text
      label: 'Value'
    format:
      type: string
      label: 'Text format'

field.formatter.settings.text_default:
  type: mapping
  label: 'Formatted text default display format settings'

field.formatter.settings.text_trimmed:
  type: mapping
  label: 'Trimmed text display format settings'
  mapping:
    trim_length:
      type: integer
      label: 'Trim length'

field.widget.settings.text_textarea:
  type: mapping
  label: 'Text area (multiple rows) display format settings'
  mapping:
    rows:
      type: integer
      label: 'Rows'
    placeholder:
      type: text
      label: 'Placeholder'

field.widget.settings.text_textfield:
  type: mapping
  label: 'Text field display format settings'
  mapping:
    size:
      type: integer
      label: 'Size of textfield'
    placeholder:
      type: label
      label: 'Placeholder'

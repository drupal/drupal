test_htmx.attachments.page:
  path: '/htmx-test-attachments/page'
  defaults:
    _title: 'Page'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::empty'
  requirements:
    _permission: 'access content'

test_htmx.attachments.swap:
  path: '/htmx-test-attachments/{swap}/swap'
  defaults:
    _title: 'Page'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::swap'
  requirements:
    _permission: 'access content'

test_htmx.attachments.wrapper:
  path: '/htmx-test-attachments/wrapper'
  defaults:
    _title: 'Minimal Response'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::withWrapperFormat'
  requirements:
    _permission: 'access content'

test_htmx.attachments.body:
  path: '/htmx-test-attachments/body'
  defaults:
    _title: 'Body testing'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::selectBody'
  requirements:
    _permission: 'access content'

test_htmx.attachments.replace:
  path: '/htmx-test-attachments/replace'
  defaults:
    _title: 'Ajax Content'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::replace'
  requirements:
    _permission: 'access content'

test_htmx.attachments.delete:
  path: '/htmx-test-attachments/delete'
  defaults:
    _title: 'Ajax Content'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::delete'
  requirements:
    _permission: 'access content'

test_htmx.attachments.route_option:
  path: '/htmx-test-attachments/route-option'
  defaults:
    _title: 'Using _htmx_route option'
    _controller: '\Drupal\test_htmx\Controller\HtmxTestAttachmentsController::replace'
  requirements:
    _permission: 'access content'
  options:
    _htmx_route: TRUE

test_htmx.attachments.ajax:
  path: '/htmx-test-attachments/ajax'
  defaults:
    _title: 'Ajax'
    _form: '\Drupal\test_htmx\Form\HtmxTestAjaxForm'
  requirements:
    _permission: 'access content'

test_htmx.form_builder_test:
  path: '/htmx-test-attachments/form-builder-test/{type}/{selected}'
  defaults:
    _title: 'Test dynamic HTMX form'
    _form: '\Drupal\test_htmx\Form\HtmxTestForm'
    type: NULL
    selected: NULL
  requirements:
    _permission: 'access content'
